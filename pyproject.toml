[project]
name = "asset-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=42.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "llama-index-core>=0.14.24",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-embeddings-ollama>=0.9.0",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-postprocessor-sbert-rerank>=0.5.0",
    "llama-index-retrievers-bm25>=0.7.1",
    "pypdf>=5.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "regex>=2024.5",
    "reportlab>=4.2",
    "torch>=2.13",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

# Linux 容器用 PyTorch 官方 CPU 轮子：剔除 CUDA 全家桶（本机/容器无 NVIDIA GPU，
# PyPI 默认 torch 在 Linux 上拖入 ~3.5GB nvidia/triton 死重）。macOS 不受影响。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
