[project]
name = "asset-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=42.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pypdf>=5.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "regex>=2024.5",
    "reportlab>=4.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false
